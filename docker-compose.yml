name: nota

services:
  db:
    image: postgres:17-alpine
    container_name: nota-db
    environment:
      POSTGRES_DB: nota
      POSTGRES_USER: nota
      POSTGRES_PASSWORD: nota_dev
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nota -d nota"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
